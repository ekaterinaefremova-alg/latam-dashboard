<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruitment LatAm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9E7F1; --panel:#FFFFFF; --fg:#14131A; --fg-2:#4A4954; --mute:#8A8996;
    --line:#D9D6E6; --line-soft:#EDEBF4;
    --accent:#6B4BC9; --accent-soft:#EDE7F8; --cap-bg:#F5F2FB; --fill:#B9A3E0; --fill-2:#E6DDF4;
    --track:#F2F1F7; --ok:#1F7A4D; --bad:#C0342B; --field:#FFFFFF;
    --shadow:0 1px 2px rgba(28,24,48,.06), 0 6px 20px rgba(28,24,48,.07);
  }
  body[data-theme="dark"]{
    --bg:#0C0E17; --panel:#1B1F2E; --fg:#F2F2F7; --fg-2:#C2C1CE; --mute:#8B8A9B;
    --line:#31364C; --line-soft:#252939;
    --accent:#A78BFA; --accent-soft:#262A3D; --cap-bg:#22273A; --fill:#8B7BC7; --fill-2:#333A54;
    --track:#232739; --ok:#5FD69A; --bad:#F58C86; --field:#1E2130;
    --shadow:none;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:26px 28px 48px;background:var(--bg);color:var(--fg);
    font-family:Montserrat,Arial,Helvetica,sans-serif;font-size:13px;line-height:1.45;
    -webkit-font-smoothing:antialiased}

  /* ---- три уровня: заголовок, подзаголовок, текст ---- */
  h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.4px}
  .sub{font-size:12px;font-weight:500;color:var(--mute)}
  .zone{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--fg-2);margin:32px 0 13px;display:flex;align-items:center;gap:11px}
  .zone::after{content:"";flex:1;height:1px;background:var(--line)}
  .cap{font-size:13px;font-weight:600;padding:13px 16px;color:var(--fg);background:var(--cap-bg);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .cap::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent);flex:none}

  #gate{max-width:320px;margin:16vh auto 0}
  #gate h1{margin-bottom:6px}
  #gate input{width:100%;font-family:inherit;font-size:14px;padding:11px 13px;color:var(--fg);
    background:var(--field);border:1px solid var(--line);border-radius:8px;margin-bottom:9px}
  #gate button{width:100%;font-family:inherit;font-size:14px;font-weight:600;padding:11px;
    color:#fff;border:none;background:var(--accent);cursor:pointer;border-radius:8px}
  #gate .err{color:var(--bad);font-size:12px;min-height:16px;margin-top:8px}

  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
    flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,.btn{font-family:inherit;font-size:13px;font-weight:500;padding:8px 12px;
    border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:8px}
  .btn{cursor:pointer;min-width:38px;font-size:14px}
  select:hover,.btn:hover{border-color:var(--accent)}
  select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .grid{display:grid;gap:16px;align-items:start}
  .g2{grid-template-columns:1fr 1fr}
  section{border:1px solid var(--line);border-radius:12px;background:var(--panel);
    overflow:hidden;box-shadow:var(--shadow)}
  .body{padding:0 16px 16px}
  .body table{margin:0 -16px;width:calc(100% + 32px)}
  .body th:first-child,.body td:first-child{padding-left:16px}
  .body th:last-child,.body td:last-child{padding-right:16px}
  .chartbox{padding-top:16px}

  /* ---- KPI ---- */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:17px 18px 16px;
    background:var(--panel);box-shadow:var(--shadow)}
  .kpi b{display:block;font-size:36px;font-weight:700;line-height:1;letter-spacing:-1.4px;
    font-variant-numeric:tabular-nums}
  .kpi span{display:block;font-size:12px;font-weight:500;color:var(--mute);margin-top:8px}
  .kpi em{font-style:normal;font-size:12px;font-weight:600;display:block;margin-top:4px}

  /* ---- таблицы ---- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--mute);
    text-align:left;padding:8px;background:var(--cap-bg);border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 8px;border-bottom:1px solid var(--line-soft);color:var(--fg-2)}
  td:first-child{color:var(--fg);font-weight:500}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:last-child td{border-bottom:none}
  tr.total td{font-weight:700;color:var(--fg);border-top:1px solid var(--line)}

  .barwrap{background:var(--track);height:6px;width:100%;border-radius:3px;overflow:hidden}
  .bar{height:6px;background:var(--fill);display:block;border-radius:3px}
  .bar.dim{background:var(--fill-2)}
  .stage{display:flex;align-items:center;gap:10px}
  .stage .barwrap{flex:1}
  .good{color:var(--ok)} .warn{color:var(--bad)} .empty{color:var(--mute);font-weight:400}

  /* ---- графики ---- */
  .chart{display:flex;align-items:flex-end;gap:8px;height:132px;padding-top:30px;margin-bottom:30px}
  .chart .col{flex:1;position:relative;height:100%;display:flex;align-items:flex-end}
  .chart .col span.v{position:absolute;top:-27px;left:0;right:0;text-align:center;
    font-size:11px;font-weight:600;line-height:1.3;color:var(--fg-2);white-space:nowrap}
  .chart .col span.b{width:100%;background:var(--fill-2);border-radius:4px 4px 0 0;min-height:3px}
  .chart .col span.b.on{background:var(--fill)}
  .chart .col u{position:absolute;bottom:-22px;left:0;right:0;text-align:center;
    text-decoration:none;font-size:11px;font-weight:500;color:var(--mute)}
  .chart .col i.plan{position:absolute;left:-1px;right:-1px;border-top:1px dashed var(--mute);
    opacity:.65;font-style:normal}
  .chartbox{padding-bottom:2px;padding-top:16px}
  .note{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.5}
  footer{margin-top:34px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}
  @media(max-width:960px){.g2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}
    body{padding:18px 16px 36px}}
</style>
</head>

const TERMS = {
  "CV in progress":          {ru:"Резюме в работе",        es:"CV en proceso"},
  "HR interview scheduled":  {ru:"HR-интервью назначено",  es:"Entrevista RR.HH. agendada"},
  "HR interview done":       {ru:"HR-интервью проведено",  es:"Entrevista RR.HH. realizada"},
  "Role-play scheduled":     {ru:"Ролевая игра назначена", es:"Role-play agendado"},
  "Role-play done":          {ru:"Ролевая игра проведена", es:"Role-play realizado"},
  "Approved for onboarding": {ru:"Допущен до онбординга",  es:"Aprobado para onboarding"},
  "Probation started":       {ru:"Вышел на испытательный", es:"Periodo de prueba iniciado"},
  "Line started":            {ru:"Вышел на линию",         es:"Incorporado a la línea"},
  "Test task assigned":      {ru:"Тестовое выдано",        es:"Prueba técnica asignada"},
  "Test task passed":        {ru:"Тестовое пройдено",      es:"Prueba técnica aprobada"},
  "Assigned to onboarding":  {ru:"Назначен на онбординг",  es:"Asignado a onboarding"},
  "Onboarding completed":    {ru:"Онбординг завершён",     es:"Onboarding completado"},
  "Final interview":         {ru:"Финальное интервью",     es:"Entrevista final"},
  "Offer made":              {ru:"Оффер выдан",            es:"Oferta enviada"},
  "All tutors":              {ru:"Все тьюторы",            es:"Todos los tutores"}
  // Названия должностей и потоков не переводятся — всегда как в таблице
};

let ROWS = [];
let lang  = sessionStorage.getItem('dashlang')  || 'ru';
let theme = sessionStorage.getItem('dashtheme') || 'light';
let hideZero = sessionStorage.getItem('dashhide') === '1';

const L = () => UI[lang];
const T = k => (lang === 'en' ? k : ((TERMS[k] || {})[lang] || k));
const isNum = v => typeof v === 'number' && isFinite(v);
const pct = v => isNum(v) ? Math.round(v*100) + '%' : '—';
const num = v => isNum(v) ? v : '—';
const money = v => isNum(v) ? '$' + Math.round(v).toLocaleString('en-US') : '—';
const bar = (f, dim) => '<div class="barwrap"><span class="bar' + (dim ? ' dim' : '') +
  '" style="width:' + (Math.max(0, Math.min(f, 1.2)) / 1.2 * 100) + '%"></span></div>';
const pick = (block, month, dim) => ROWS
  .filter(r => r.block === block && (month === undefined || r.month === month) && (dim === undefined || r.dim === dim))
  .sort((a,b) => (a.order||0) - (b.order||0));

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'&&text[i+1]==='"'){cell+='"';i++;} else if(c==='"'){q=false;} else cell+=c; }
    else if(c==='"') q=true;
    else if(c===',') { row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c; }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}

async function load(){
  const res = await fetch(CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now());
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const table = parseCSV(await res.text());
  const head = (table[0]||[]).map(h => h.replace(/^\uFEFF/,'').trim());
  const at = name => head.indexOf(name);
  const n = v => {
    if(v === undefined || v === null || v === '') return null;
    const s = String(v).trim();
    if(/^-?[\d\s.,]+%$/.test(s)){
      const x = Number(s.replace('%','').replace(/\s/g,'').replace(',','.'));
      return isNaN(x) ? null : x/100;
    }
    const x = Number(s.replace(/[\s$]/g,'').replace(',','.'));
    return isNaN(x) ? null : x;
  };
  ROWS = table.slice(1).filter(r => r[at('block')]).map(r => ({
    year:n(r[at('year')]), month:n(r[at('month')]),
    block:r[at('block')], key:r[at('key')]||'', dim:r[at('dim')]||'',
    plan:n(r[at('plan')]), fact:n(r[at('fact')]), extra:n(r[at('extra')]), order:n(r[at('order')])
  }));
}

function chart(el, items){
  const vals  = items.map(i => isNum(i.v) ? i.v : 0);
  const plans = items.map(i => isNum(i.p) ? i.p : 0);
  const max = Math.max(...vals, ...plans, 0.0001);
  el.innerHTML = items.map(i => {
    const h  = isNum(i.v) ? Math.max(i.v/max*100, 2) : 0;
    const ph = isNum(i.p) ? Math.min(i.p/max*100, 100) : null;
    return '<div class="col">' +
      (ph !== null ? '<i class="plan" style="bottom:' + ph + '%"></i>' : '') +
      '<span class="v">' + (i.top || '') + '</span>' +
      '<span class="b' + (i.dim ? '' : ' on') + '" style="height:' + h + '%"></span>' +
      '<u>' + i.label + '</u></div>';
  }).join('');
}

function funnel(id, rows){
  const t = L();
  const tb = document.querySelector('#' + id + ' tbody');
  if(!rows.length){ tb.innerHTML = '<tr><td colspan="5" class="empty">' + t.nodata + '</td></tr>'; return; }
  const top = rows[0].fact;
  tb.innerHTML = rows.map((r,i) => {
    const prev = i > 0 ? rows[i-1].fact : null;
    const conv = i === 0 ? 1 : (isNum(r.fact) && prev) ? r.fact/prev : null;
    const cum  = (isNum(r.fact) && top) ? r.fact/top : null;
    return '<tr><td>' + T(r.key) + '</td><td class="n">' + num(r.plan) + '</td><td class="n">' + num(r.fact) +
      '</td><td class="n">' + pct(conv) + '</td><td>' +
      (cum === null ? '<span class="empty">—</span>' : bar(cum)) + '</td></tr>';
  }).join('');
}

function applyChrome(){
  document.body.setAttribute('data-theme', theme);
  document.documentElement.lang = lang;
  const t = L(), set = (id,v) => { const e = document.getElementById(id); if(e) e.textContent = v; };
  set('g_hint',UI.en.hint); set('go',UI.en.ok); set('l_upd',t.upd);
  set('z1',t.z1); set('z2',t.z2); set('z3',t.z3); set('z4',t.z4); set('z5',t.z5);
  set('c_tcm',t.tcm); set('c_tut',t.tut); set('c_hiring',t.hiring);
  set('c_lined',t.lined); set('c_attr',t.attr); set('c_cph',t.cph); set('c_cost',t.cost);
  set('l_k1',t.k1); set('l_k2',t.k2); set('l_k3',t.k3); set('l_k4',t.k4); set('l_k5',t.k5);
  set('h_role',t.role); set('h_done',t.done); set('h_stream',t.stream);
  set('h_spend',t.spend); set('h_hires',t.hires); set('h_cph',t.cphh);
  set('n_attr',t.nattr); set('n_line',t.nline); set('n_cph',t.ncph); set('n_cost',t.ncost);
  set('foot', t.foot + '   ·   build v7 · 03.09.2026');
  document.querySelectorAll('.h_plan').forEach(e => e.textContent = t.plan);
  document.querySelectorAll('.h_fact').forEach(e => e.textContent = t.fact);
  document.querySelectorAll('.h_stage').forEach(e => e.textContent = t.stage);
  document.querySelectorAll('.h_conv').forEach(e => e.textContent = t.conv);
  document.querySelectorAll('.h_fromcv').forEach(e => e.textContent = t.fromcv);
  document.getElementById('hidezero').textContent = hideZero ? t.showall : t.hide;
  document.getElementById('lang').value = lang;
}

function boot(){
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  applyChrome();
  document.getElementById('upd').textContent = new Date().toLocaleString(
    lang === 'ru' ? 'ru-RU' : (lang === 'es' ? 'es-ES' : 'en-GB'), {dateStyle:'short', timeStyle:'short'});

  const months = [...new Set(ROWS.filter(r => r.month > 0).map(r => r.month))].sort((a,b) => a-b);
  const sel = document.getElementById('month'), cur = sel.value;
  sel.innerHTML = months.map(m => '<option value="' + m + '">' + L().months[m-1] + '</option>').join('');
  const nowM = new Date().getMonth() + 1;
  sel.value = cur || (months.includes(nowM) ? nowM : months[months.length-1]);

  const dsel = document.getElementById('dir');
  const dims = [...new Set(pick('funnel_tutor').map(r => r.dim))].filter(Boolean);
  const curD = dsel.selectedOptions.length ? dsel.selectedOptions[0].dataset.raw : null;
  dsel.innerHTML = dims.map(d => '<option data-raw="' + d + '">' + T(d) + '</option>').join('');
  const di = dims.indexOf(curD); if(di >= 0) dsel.selectedIndex = di;

  sel.onchange = render; dsel.onchange = render;
  render();
}

function render(){
  const t = L();
  const m = +document.getElementById('month').value;
  const dsel = document.getElementById('dir');
  const dir = dsel.selectedOptions.length ? dsel.selectedOptions[0].dataset.raw : undefined;
  const g = (arr,k) => (arr.find(r => r.key === k) || {});

  /* --- зона 1: сводка --- */
  const line = pick('line', m), now = pick('now', 0);
  const onLine = g(line,'in_line').fact, planLine = g(line,'in_line').plan;
  const attrRow = pick('attrition', m)[0] || {};
  const totalCost = pick('cost', m, 'Total')[0] || {};
  document.getElementById('k1').textContent = num(onLine);
  document.getElementById('k2').textContent = num(g(now,'probation').fact);
  document.getElementById('k3').textContent = num(g(now,'onboarding').fact);
  document.getElementById('k4').textContent = num(g(line,'left_month').fact);
  document.getElementById('k5').textContent = money(totalCost.extra);
  const d1 = document.getElementById('d1');
  if(isNum(onLine) && isNum(planLine) && planLine){
    const v = onLine/planLine;
    d1.className = v >= 1 ? 'good' : (v < 0.9 ? 'warn' : '');
    d1.textContent = pct(v) + ' ' + t.toplan;
  } else { d1.textContent = ''; d1.className = ''; }
  const isClosed = g(line,'closed').fact === 1;
  document.getElementById('linenote').textContent =
    (isNum(planLine) ? t.notePlan + planLine + '. ' : '') +
    (isClosed ? t.closed : t.live) + ' ' + t.noteNow;

  /* --- зона 2: воронки --- */
  funnel('ftcm', pick('funnel_tcm', m));
  funnel('ftut', pick('funnel_tutor', m, dir));

  /* --- зона 3: наём по ролям --- */
  const hpAll = pick('hiring', m);
  const empty = r => !(isNum(r.plan) && r.plan > 0) && !(isNum(r.fact) && r.fact > 0);
  const hp = hideZero ? hpAll.filter(r => !empty(r)) : hpAll;
  const hiddenCount = hpAll.length - hp.length;
  document.querySelector('#hp tbody').innerHTML = hp.length ? hp.map(r => {
    const v = r.plan ? r.fact/r.plan : null;
    const cell = (v === null) ? '<span class="empty">' + t.noplan + '</span>'
      : '<div class="stage">' + bar(v) + '<span class="' + (v>=1?'good':(v<0.5?'warn':'')) +
        '" style="width:34px;text-align:right">' + pct(v) + '</span></div>';
    return '<tr><td>' + T(r.key) + '</td><td class="n">' + num(r.plan) + '</td><td class="n">' +
      num(r.fact) + '</td><td>' + cell + '</td></tr>';
  }).join('') : '<tr><td colspan="4" class="empty">' + t.nodata + '</td></tr>';
  document.getElementById('n_hp').textContent =
    hiddenCount ? t.z3 + t.hidden + hiddenCount : '';

  /* --- зона 4: динамика --- */
  const lineMonths = pick('line').filter(r => r.key === 'in_line' && (isNum(r.fact) || isNum(r.plan)));
  chart(document.getElementById('ch_line'), lineMonths.map(r => ({
    label:t.short[r.month-1], v:r.fact, p:r.plan, dim:r.month !== m,
    top: isNum(r.fact) ? String(Math.round(r.fact)) : ''
  })));

  const attr = pick('attrition').filter(r => isNum(r.plan) && r.plan > 0);
  chart(document.getElementById('ch_attr'), attr.map(r => ({
    label:t.short[r.month-1], v:r.extra, dim:r.month !== m,
    top: (isNum(r.fact) ? r.fact + ' ' + t.ppl : '') + (isNum(r.extra) ? '<br>' + pct(r.extra) : '')
  })));

  /* --- зона 5: стоимость по потокам --- */
  const cost = pick('cost', m).filter(r => isNum(r.plan) || isNum(r.fact) || isNum(r.extra));
  const maxC = Math.max(...cost.map(r => isNum(r.extra) ? r.extra : 0), 0.0001);
  document.querySelector('#cost tbody').innerHTML = cost.length ? cost.map(r =>
    '<tr' + (r.dim === 'Total' ? ' class="total"' : '') + '><td>' + r.dim + '</td><td class="n">' +
    money(r.plan) + '</td><td class="n">' + num(r.fact) + '</td><td class="n">' + money(r.extra) +
    '</td><td>' + (isNum(r.extra) ? bar(r.extra/maxC*1.2, r.dim === 'Total') : '') + '</td></tr>'
  ).join('') : '<tr><td colspan="5" class="empty">' + t.nocost + '</td></tr>';
}

async function enter(pw, silent){
  const err = document.getElementById('err');
  if(pw !== PASSWORD){ if(!silent) err.textContent = UI.en.wrong; sessionStorage.removeItem('dashpw'); return; }
  err.textContent = UI.en.loading;
  try { await load(); sessionStorage.setItem('dashpw', pw); boot(); }
  catch(e){ err.textContent = e.message; }
}

document.getElementById('lang').onchange = e => {
  lang = e.target.value; sessionStorage.setItem('dashlang', lang); boot();
};
document.getElementById('hidezero').onclick = () => {
  hideZero = !hideZero;
  sessionStorage.setItem('dashhide', hideZero ? '1' : '0');
  applyChrome(); render();
};
document.getElementById('theme').onclick = () => {
  theme = theme === 'light' ? 'dark' : 'light';
  sessionStorage.setItem('dashtheme', theme);
  document.body.setAttribute('data-theme', theme);
};
document.getElementById('go').onclick = () => enter(document.getElementById('pw').value);
document.getElementById('pw').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('go').click();
});
document.getElementById('reload').onclick = async () => { await load(); boot(); };

document.body.setAttribute('data-theme', theme);
applyChrome();
const saved = sessionStorage.getItem('dashpw');
if(saved) enter(saved, true); else document.getElementById('pw').focus();
</script>
</body>
